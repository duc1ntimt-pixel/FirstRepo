apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: test-connection-{{ ts_nodash.lower() }}
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  sparkVersion: "3.5.1"
  image: apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/airflow/dags/test_connection_spark.py
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark-driver
  executor:
    instances: 1
    cores: 1
    memory: "1g"
  restartPolicy:
    type: Never
  ttlSecondsAfterFinished: 3600