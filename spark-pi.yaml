apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-test-{{ ts_nodash | lower }}
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  sparkVersion: "3.5.1"
  image: apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py

  driver:
    cores: 1                 # số nguyên
    coreRequest: "100m"      # 0.1 CPU, rất nhẹ
    coreLimit: "250m"
    memory: "256m"           # nhẹ
    memoryOverhead: "64m"
    serviceAccount: spark-driver
    deleteOnTermination: false

  executor:
    instances: 1
    cores: 1
    coreRequest: "100m"
    coreLimit: "250m"
    memory: "256m"
    memoryOverhead: "64m"

  restartPolicy:
    type: Never
