apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-test-{{ ts_nodash | lower }}
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  sparkVersion: "3.5.1"
  image: apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py

  driver:
    cores: 1
    coreRequest: "250m"
    coreLimit: "500m"
    memory: "1Gi"            # tăng lên để driver start được
    memoryOverhead: "256m"
    serviceAccount: spark-driver
    deleteOnTermination: false

  executor:
    instances: 1
    cores: 1
    coreRequest: "250m"
    coreLimit: "500m"
    memory: "1Gi"           # tăng lên
    memoryOverhead: "256m"

  restartPolicy:
    type: Never
